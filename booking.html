<div class="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 z-10">
    
    <!-- Header -->
    <div class="text-center mb-16">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-100 dark:bg-brand-900/30 text-brand-500 mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        </div>
        <h1 class="text-4xl md:text-5xl font-extrabold font-display text-gray-900 dark:text-white mb-4">
            Secure Your Spot
        </h1>
        <p class="text-lg text-gray-600 dark:text-gray-400 max-w-xl mx-auto">
            Reserve your session in our upcoming classes or schedule a 1-on-1 consultation. Let's get to work.
        </p>
    </div>

    <!-- Main Glass Card -->
    <div class="glass rounded-[2rem] p-8 md:p-12 shadow-2xl relative overflow-hidden">
        <!-- Decoration -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-brand-500/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
        
        <!-- Success State -->
        <div ng-if="bookingCtrl.status === 'success'" class="relative z-10 text-center py-12 animate-[fadeIn_0.5s_ease-out]">
            <div class="mx-auto flex items-center justify-center h-24 w-24 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 shadow-[0_0_30px_rgba(52,211,153,0.4)] mb-8 transform scale-110">
                <svg class="h-12 w-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-display font-bold text-gray-900 dark:text-white mb-4">You're Locked In!</h2>
            <p class="text-lg text-gray-600 dark:text-gray-400 mb-10 max-w-md mx-auto">We've received your request and will see you at the gym soon. Check your email for confirmation details.</p>
            <button ng-click="bookingCtrl.status = 'idle'" class="inline-flex items-center justify-center px-8 py-4 font-bold text-white bg-gray-900 dark:bg-white dark:text-gray-900 rounded-xl hover:scale-105 transition-transform">
                Book Another Session
            </button>
        </div>

        <!-- Booking Form -->
        <form name="bookingForm" ng-submit="bookingCtrl.submitBooking(bookingForm)" novalidate ng-if="bookingCtrl.status !== 'success'" class="relative z-10">
            <div class="space-y-12">
                
                <!-- Personal Details Section -->
                <div>
                    <h3 class="text-xl font-display font-bold text-gray-900 dark:text-white mb-6 flex items-center">
                        <span class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm mr-3">1</span>
                        Personal Info
                    </h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="group">
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Full Name</label>
                            <input type="text" name="name" ng-model="bookingCtrl.bookingData.name" required
                                class="w-full bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all group-hover:border-gray-300 dark:group-hover:border-gray-600"
                                ng-class="{'border-red-500 focus:ring-red-500': bookingForm.name.$invalid && bookingForm.name.$touched}"
                                placeholder="Juan Dela Cruz">
                        </div>
                        <div class="group">
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Email Address</label>
                            <input type="email" name="email" ng-model="bookingCtrl.bookingData.email" required
                                class="w-full bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-all group-hover:border-gray-300 dark:group-hover:border-gray-600"
                                ng-class="{'border-red-500 focus:ring-red-500': bookingForm.email.$invalid && bookingForm.email.$touched}"
                                placeholder="juan.dela.cruz@example.com">
                        </div>
                    </div>
                </div>

                <!-- Session Selection Section -->
                <div>
                    <h3 class="text-xl font-display font-bold text-gray-900 dark:text-white mb-6 flex items-center">
                        <span class="w-8 h-8 rounded-lg bg-gray-100 dark:bg-gray-800 flex items-center justify-center text-sm mr-3">2</span>
                        Session Details
                    </h3>
                    
                    <div class="mb-6 group">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Training Type</label>
                        <select name="service" ng-model="bookingCtrl.bookingData.service" required
                            class="w-full appearance-none bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all cursor-pointer">
                            <option value="" disabled selected>Select a program...</option>
                            <option ng-repeat="service in bookingCtrl.services" value="{{service.id}}">{{service.name}}</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div class="group">
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Date</label>
                            <select name="date" ng-model="bookingCtrl.bookingData.date" required
                                class="w-full appearance-none bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all cursor-pointer">
                                <option value="" disabled selected>Choose a date</option>
                                <option ng-repeat="date in bookingCtrl.availableDates" value="{{date}}">{{date}}</option>
                            </select>
                        </div>
                        <div class="group">
                            <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Time</label>
                            <select name="time" ng-model="bookingCtrl.bookingData.time" required
                                class="w-full appearance-none bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all cursor-pointer">
                                <option value="" disabled selected>Choose a time</option>
                                <option ng-repeat="time in bookingCtrl.timeSlots" value="{{time}}">{{time}}</option>
                            </select>
                        </div>
                    </div>

                    <div class="group">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">Additional Notes <span class="font-normal text-gray-400">(Optional)</span></label>
                        <textarea name="notes" rows="3" ng-model="bookingCtrl.bookingData.notes"
                            class="w-full bg-white/50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 rounded-xl px-5 py-4 text-gray-900 dark:text-white focus:ring-2 focus:ring-brand-500 outline-none transition-all resize-none"
                            placeholder="Any specific goals or injuries?"></textarea>
                    </div>
                </div>
            </div>

            <!-- Submit Action -->
            <div class="mt-12">
                <button type="submit" 
                        ng-disabled="bookingForm.$invalid || bookingCtrl.status === 'submitting'"
                        class="w-full flex items-center justify-center px-8 py-5 font-bold text-white text-lg bg-gradient-to-r from-brand-500 to-orange-600 rounded-xl hover:shadow-[0_0_30px_rgba(255,157,0,0.4)] hover:scale-[1.02] focus:outline-none transition-all disabled:opacity-50 disabled:hover:scale-100 disabled:cursor-not-allowed">
                    
                    <span ng-if="bookingCtrl.status !== 'submitting'">Confirm Booking</span>
                    
                    <span ng-if="bookingCtrl.status === 'submitting'" class="flex items-center">
                        <svg class="animate-spin -ml-1 mr-3 h-6 w-6 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Processing...
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
